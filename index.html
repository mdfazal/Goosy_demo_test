<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>To-Do List</h1>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs to be done?" autocomplete="off" aria-label="New task" required>
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>

    <p id="empty-state">No tasks yet. Add one above!</p>

    <div class="footer">
      <span id="task-count"></span>
      <button id="clear-completed" type="button">Clear completed</button>
    </div>
  </main>
</body>
</html>
